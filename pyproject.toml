[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dq-workbench"
version = "0.1.0"
description = "Unified DQ anomaly workbench: three-layer check orchestration, issue tickets with human-close-only state machine, append-only audit chain. Rejected findings never touch master data."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "TopPrism WP08" }]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["dq_workbench*"]
